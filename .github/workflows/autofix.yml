name: Formatting report

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-report-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: eeglab_mcp_server/pyproject.toml

      - name: Install the formatter and linter
        run: python -m pip install -e ./eeglab_mcp_server[dev]

      - name: Show what black and ruff would change
        continue-on-error: true
        run: |
          echo "### black --check --diff"
          python -m black --check --diff eeglab_mcp_server scripts || true
          echo "### ruff check --fix --diff"
          python -m ruff check eeglab_mcp_server scripts --fix --diff || true