name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matlab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: CI / validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate the official extension and repository contract
        run: node scripts/verify_repository.mjs
      - name: Download and checksum the official MathWorks release
        id: mathworks
        run: node scripts/fetch_mathworks_server.mjs "$RUNNER_TEMP/mathworks-mcp"
      - name: Verify the official MCP tool catalog
        env:
          MCP_BINARY: ${{ steps.mathworks.outputs.binary }}
        run: node scripts/verify_mcp.mjs "$MCP_BINARY" catalog "$RUNNER_TEMP/mcp-catalog.json"
      - name: Check out EEGLAB and its bundled plugins
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/sccn/eeglab.git "$RUNNER_TEMP/eeglab"
          git clone --depth 1 https://github.com/sccn/cleanline.git "$RUNNER_TEMP/eeglab/plugins/cleanline"
      - name: Provision MATLAB in GitHub cloud
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox
      - name: Run MATLAB regressions, real EEG workflows and official MCP calls
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        env:
          MCP_BINARY: ${{ steps.mathworks.outputs.binary }}
        with:
          command: addpath('matlab/tests'); run_eegmcp_cloud_suite(fullfile(getenv('RUNNER_TEMP'), 'eeglab'))
      - name: Verify live MATLAB tools through the official server
        env:
          MW_BATCH_LICENSING_ONLINE: "true"
          MCP_BINARY: ${{ steps.mathworks.outputs.binary }}
        run: node scripts/verify_mcp.mjs "$MCP_BINARY" live "$RUNNER_TEMP/eeglab-mcp-results/mcp-live-result.json" "$RUNNER_TEMP/eeglab"
      - name: Verify a real cloud ERP request
        env:
          MW_BATCH_LICENSING_ONLINE: "true"
          GITHUB_EVENT_PATH: ${{ github.workspace }}/matlab/tests/fixtures/cloud-event.json
          MCP_BINARY: ${{ steps.mathworks.outputs.binary }}
        run: |
          node scripts/verify_mcp.mjs "$MCP_BINARY" request "$RUNNER_TEMP/eeglab-mcp-results/mcp-request-result.json" "$RUNNER_TEMP/eeglab"
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/eeglab-mcp-results/mcp-request-result.json")); assert.equal(r.response.status,"success"); assert(fs.existsSync(r.response.outputs.output_path));'
      - name: Save MCP validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: matlab-mcp-validation
          path: |
            ${{ runner.temp }}/mcp-catalog.json
            ${{ runner.temp }}/eeglab-mcp-results/mcp-live-result.json
            ${{ runner.temp }}/eeglab-mcp-results/mcp-live-harness.log
            ${{ runner.temp }}/eeglab-mcp-results/mcp-request-result.json
            ${{ runner.temp }}/eeglab-mcp-results/mcp-request-harness.log
          if-no-files-found: ignore

  portability:
    name: Official MCP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate the official extension contract
        run: node scripts/verify_repository.mjs
      - name: Download and checksum the official MathWorks release
        id: mathworks
        run: node scripts/fetch_mathworks_server.mjs "${{ runner.temp }}/mathworks-mcp"
      - name: Verify the official MCP tool catalog
        env:
          MCP_BINARY: ${{ steps.mathworks.outputs.binary }}
        run: node scripts/verify_mcp.mjs "$env:MCP_BINARY" catalog "${{ runner.temp }}/mcp-catalog.json"
        shell: pwsh
