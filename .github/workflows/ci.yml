name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: eeglab_mcp_server/pyproject.toml

      - name: Check that no CJK characters are committed
        run: |
          python -c "
          import pathlib, re, sys
          pattern = re.compile('[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]')
          extensions = {'.py', '.md', '.json', '.toml', '.yaml', '.yml', '.xml', '.ps1', '.bat', '.txt', '.cfg', '.ini'}
          offenders = []
          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in extensions:
                  continue
              if pattern.search(path.read_text(encoding='utf-8', errors='ignore')):
                  offenders.append(str(path))
          for name in offenders:
              print('CJK characters found in ' + name)
          sys.exit(1 if offenders else 0)
          "

      - name: Install package and dev dependencies
        id: install
        run: python -m pip install -e ./eeglab_mcp_server[dev]

      - name: Lint with ruff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff check eeglab_mcp_server scripts

      - name: Check formatting with black
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m black --check eeglab_mcp_server scripts

      - name: Type check with mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m mypy --config-file eeglab_mcp_server/pyproject.toml eeglab_mcp_server

      - name: Run framework verifier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/verify_framework.py

      - name: Run official alignment verifier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/verify_official_alignment.py

  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: eeglab_mcp_server/pyproject.toml

      - name: Install package and dependencies
        run: python -m pip install -e ./eeglab_mcp_server

      - name: Import the server module
        run: python -c "import eeglab_mcp_server.server"

      - name: Run framework verifier
        run: python scripts/verify_framework.py

      - name: Run official alignment verifier
        run: python scripts/verify_official_alignment.py
