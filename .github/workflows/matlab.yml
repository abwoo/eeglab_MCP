name: MATLAB tools

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matlab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eegmcp:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check out EEGLAB
        run: git clone --depth 1 https://github.com/sccn/eeglab.git "$RUNNER_TEMP/eeglab"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: Write gate test cases from the Python gates
        run: |
          python -m pip install -e ./eeglab_mcp_server
          python matlab/tests/generate_gate_cases.py "$RUNNER_TEMP/gate_cases.json"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: R2024b

      - name: Run the gate tests and the tool tests against the EEGLAB sample dataset
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: addpath('matlab/tests'); run_eegmcp_gate_tests(fullfile(getenv('RUNNER_TEMP'), 'gate_cases.json')); run_eegmcp_tests(fullfile(getenv('RUNNER_TEMP'), 'eeglab'))
