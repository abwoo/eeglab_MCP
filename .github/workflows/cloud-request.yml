name: MATLAB cloud request

on:
  workflow_dispatch:
    inputs:
      tool:
        description: Reviewed eeglab tool to run through native MATLAB MCP
        required: true
        default: eeglab_method_preflight
      arguments:
        description: JSON tool options; @sample and @artifacts resolve on the runner
        required: true
        default: '{"method":"epoch","context":{}}'

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate the extension contract
        run: node scripts/verify_repository.mjs
      - name: Check out EEGLAB and its bundled plugins
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/sccn/eeglab.git "$RUNNER_TEMP/eeglab"
          git clone --depth 1 https://github.com/sccn/cleanline.git "$RUNNER_TEMP/eeglab/plugins/cleanline"
      - name: Provision MATLAB in GitHub cloud
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox
      - name: Execute the reviewed tool over native MATLAB MCP
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: addpath('matlab'); eegmcp_cloud_run(fullfile(getenv('RUNNER_TEMP'),'eeglab'),'request')
      - name: Upload the response and derivative files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matlab-cloud-response
          path: ${{ runner.temp }}/eeglab-mcp-results/
          if-no-files-found: error
          retention-days: 7
